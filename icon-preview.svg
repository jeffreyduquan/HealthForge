<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#141A26"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="54" x2="108" y2="54">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>

  <!-- Abstract H — two overlapping rounded bars -->
  <!-- Left pillar (Violet) -->
  <rect x="22" y="22" width="16" height="64" rx="8" fill="url(#violet)" opacity="0.95"/>
  <!-- Right pillar (Cyan) -->
  <rect x="70" y="22" width="16" height="64" rx="8" fill="url(#cyan)" opacity="0.95"/>
  <!-- Cross bridge (Gradient) -->
  <rect x="22" y="44" width="64" height="16" rx="8" fill="url(#accent)" opacity="0.95"/>

  <!-- Subtle glow dot at center -->
  <circle cx="54" cy="52" r="4" fill="#FFFFFF" opacity="0.6"/>
</svg>
