name: server-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'admin-ui/**'
      - 'deploy/**'
      - '.github/workflows/server.yml'
      - '.github/workflows/admin-ui.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'admin-ui/**'
      - '.github/workflows/server.yml'

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build server
        working-directory: server
        run: gradle bootJar --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthforge-server-jar
          path: server/build/libs/*.jar
          retention-days: 14

  build-admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install
        working-directory: admin-ui
        run: npm ci || npm install

      - name: Build
        working-directory: admin-ui
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: healthforge-admin-ui-dist
          path: admin-ui/dist
          retention-days: 14

  docker-publish:
    runs-on: ubuntu-latest
    needs: [build-server]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/jeffreyduquan/healthforge-server:latest
            ghcr.io/jeffreyduquan/healthforge-server:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-publish, build-admin-ui]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download admin-ui dist
        uses: actions/download-artifact@v4
        with:
          name: healthforge-admin-ui-dist
          path: admin-ui-dist

      - name: Copy Caddyfile to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 159.195.151.92
          username: endgear
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/Caddyfile
          target: /opt/healthforge/
          strip_components: 0

      - name: Deploy admin UI files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 159.195.151.92
          username: endgear
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: admin-ui-dist/.
          target: /opt/healthforge/admin-ui-dist/
          strip_components: 1

      - name: Deploy API + reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.195.151.92
          username: endgear
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/healthforge
            # Caddyfile liegt jetzt unter deploy/Caddyfile, aber docker-compose erwartet es im Root
            cp deploy/Caddyfile Caddyfile
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d api
            docker compose -f docker-compose.prod.yml exec caddy caddy reload --config /etc/caddy/Caddyfile || \
              docker compose -f docker-compose.prod.yml restart caddy
