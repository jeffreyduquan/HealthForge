name: server-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build server
        working-directory: server
        run: gradle bootJar --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthforge-server-jar
          path: server/build/libs/*.jar
          retention-days: 14

  docker-publish:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/jeffreyduquan/healthforge-server:latest
            ghcr.io/jeffreyduquan/healthforge-server:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-publish]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.195.151.92
          username: endgear
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/healthforge

            # Caddyfile aus dem Repo auf den Server kopieren
            cat > /tmp/Caddyfile << 'CADDYEOF'
{{ range $i, $line := .Files.Get "deploy/Caddyfile" | splitList "\n" }}{{ $line }}{{ printf "\n" }}{{ end }}
CADDYEOF
            mv /tmp/Caddyfile Caddyfile

            # API aktualisieren
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d api

            # Caddy neuladen (neue Konfiguration + ggf. neues Admin-UI)
            docker compose -f docker-compose.prod.yml exec caddy caddy reload --config /etc/caddy/Caddyfile || \
              docker compose -f docker-compose.prod.yml restart caddy
