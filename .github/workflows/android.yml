name: android-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android_app
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        working-directory: android_app
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: healthforge-app-debug
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ─────────────────────────────────────────────────────
      # Auto-Deploy: Neue APK im Admin-Panel registrieren
      # Nur bei Push auf main (nicht bei PRs)
      # ─────────────────────────────────────────────────────
      - name: Deploy APK to Admin Panel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e

          APK_PATH="android_app/app/build/outputs/apk/debug/app-debug.apk"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          # Version: app version + CI-Build-Nummer + kurzer Commit-Hash
          VERSION="0.1.0-ci.${{ github.run_number }}.${GITHUB_SHA:0:7}"
          CHANGELOG=$(echo "$COMMIT_MSG" | head -5)

          echo "📦 Version: $VERSION"
          echo "📝 Changelog: $CHANGELOG"

          # Login → JWT holen
          LOGIN_RESP=$(curl -s -X POST "${API_URL}/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}")

          TOKEN=$(echo "$LOGIN_RESP" | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Login fehlgeschlagen: $LOGIN_RESP"
            exit 1
          fi
          echo "✅ Login OK"

          # APK hochladen
          UPLOAD_RESP=$(curl -s -X POST "${API_URL}/admin/v1/releases" \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@${APK_PATH}" \
            -F "version=${VERSION}" \
            -F "changelog=${CHANGELOG}")

          echo "✅ Release erstellt: $(echo $UPLOAD_RESP | jq -r '.version // "?"')"

