name: android-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android_app
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        working-directory: android_app
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: healthforge-app-debug
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ─────────────────────────────────────────────────────
      # Auto-Deploy: Neue APK im Admin-Panel registrieren
      # Nur bei Push auf main (nicht bei PRs)
      # ─────────────────────────────────────────────────────
      - name: Deploy APK to Admin Panel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e

          echo "🔍 Checking prerequisites..."
          command -v jq >/dev/null 2>&1 || { echo "Installing jq…"; sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

          if [ -z "$API_URL" ] || [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "⚠️  Secrets nicht gesetzt – Deploy übersprungen"
            echo "   Erstelle GitHub Secrets: API_URL, ADMIN_EMAIL, ADMIN_PASSWORD"
            exit 0
          fi

          APK_SRC="android_app/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "❌ APK nicht gefunden: $APK_SRC"
            exit 0
          fi

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION="0.1.0-ci.${{ github.run_number }}.${GITHUB_SHA:0:7}"
          APK_FILENAME="HealthForge-${VERSION}.apk"
          APK_PATH="$(dirname "$APK_SRC")/$APK_FILENAME"
          cp "$APK_SRC" "$APK_PATH"

          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "📦 APK: $APK_FILENAME (${APK_SIZE} bytes)"

          CHANGELOG=$(echo "$COMMIT_MSG" | head -5)
          echo "📦 Version: $VERSION"

          # API reachable?
          echo "🏓 Ping API…"
          curl -sS --connect-timeout 10 "${API_URL}/actuator/health" > /dev/null || {
            echo "⚠️  API nicht erreichbar – Deploy übersprungen"
            exit 0
          }

          # Login → JWT
          echo "🔑 Login als $ADMIN_EMAIL…"
          LOGIN_RESP=$(curl -sS -X POST "${API_URL}/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}") || {
            echo "❌ Login fehlgeschlagen (curl exit $?)"
            exit 0
          }

          TOKEN=$(echo "$LOGIN_RESP" | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Login fehlgeschlagen: $(echo $LOGIN_RESP | jq -r '.message // "unbekannter Fehler"')"
            exit 0
          fi
          echo "✅ Login OK"

          # APK hochladen
          echo "📤 Uploading release v${VERSION}…"
          UPLOAD_RESP=$(curl -sS -X POST "${API_URL}/admin/v1/releases" \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@${APK_PATH}" \
            -F "version=${VERSION}" \
            -F "changelog=${CHANGELOG}") || {
            echo "❌ Upload fehlgeschlagen (curl exit $?)"
            exit 0
          }

          echo "✅ Release erstellt: v$(echo $UPLOAD_RESP | jq -r '.version // "?"') (ID: $(echo $UPLOAD_RESP | jq -r '.id // "?"'))"

