name: admin-ui-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'admin-ui/**'
      - '.github/workflows/admin-ui.yml'
  pull_request:
    paths:
      - 'admin-ui/**'
      - '.github/workflows/admin-ui.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install
        working-directory: admin-ui
        run: npm ci || npm install

      - name: Build
        working-directory: admin-ui
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: healthforge-admin-ui-dist
          path: admin-ui/dist
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: healthforge-admin-ui-dist
          path: dist

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 159.195.151.92
          username: endgear
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: dist/*
          target: /opt/healthforge/admin-ui-dist/
          strip_components: 1
          rm: true

      - name: Reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.195.151.92
          username: endgear
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/healthforge
            docker compose -f docker-compose.prod.yml exec caddy caddy reload --config /etc/caddy/Caddyfile || \
              docker compose -f docker-compose.prod.yml restart caddy
